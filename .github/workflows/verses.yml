name: Fetch verse texts

# The Quran API is unreachable from the dev container; CI fetches the verse texts
# and pushes them to the data-verses branch for review.
on:
  workflow_dispatch:
  push:
    branches: [master, content]
    paths: ['.github/tools/fetch_verses.py']

permissions:
  contents: write

jobs:
  verses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/tools/fetch_verses.py
      - name: Push to data-verses
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan data-verses
          git rm -rfq --cached .
          git add -f verses   # the folder is in .gitignore for local runs
          git commit -qm "Verse texts from api.alquran.cloud"
          git push -f origin data-verses
